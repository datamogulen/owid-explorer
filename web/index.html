<html lang="sv">
<head>
<meta charset="utf-8">

<!-- hedin.it:s gemensamma besöksräkning. Skriptet bär också samtyckesrutan:
     inga cookies sätts förrän besökaren godkänner. -->
<script src="/analytics.js" defer></script>
<style>
  /* ── Ljus, varm botten ─────────────────────────────────────────────────
     Mörk glob på mörk sida gav svart på svart. Paletten är beige och varm,
     och havet på globen följer med — den färgen sitter i shadern och skickas
     med som parameter, så klimatgloberna får behålla sin mörka. */
  :root { color-scheme: light; --globbredd: 46vw; --globkrom: 250px;
          --grund: #f4efe4; --yta: #fbf8f1; --yta2: #ebe4d6; --linje: #d9cfbd;
          --text: #2a251d; --dov: #6f6656; --svag: #8d8371;
          --markera: #2f6289; --markera-yta: #dfeaf3; --bar: #9a6510; --bar-yta: #f2e6d2; }
  :root[data-tema="ljus"] { --grund: #f2f3f5; --yta: #ffffff; --yta2: #e7e9ec;
          --linje: #d3d7dc; --text: #1d2126; --dov: #5c646d; --svag: #838b94;
          --markera: #2f6289; --markera-yta: #dfeaf3; --bar: #8a5a12; --bar-yta: #f3e8d6; }
  :root[data-tema="mork"] { color-scheme: dark;
          --grund: #14161a; --yta: #1a1d22; --yta2: #23272e; --linje: #3a3f47;
          --text: #e8e6e0; --dov: #9aa0a8; --svag: #767c85;
          --markera: #7aa7ff; --markera-yta: #274056; --bar: #d7a154; --bar-yta: #2c2415; }
  :root[data-tema="ljus"] canvas.glob { background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e4e7ea 78%); }
  :root[data-tema="mork"] canvas.glob { background: radial-gradient(circle at 50% 45%, #1d2128 0%, #101216 70%); }
  :root[data-tema="mork"] #styrfalt { background: rgba(18,20,24,.96);
          box-shadow: 0 1px 0 var(--linje), 0 3px 12px rgba(0,0,0,.45); }
  :root[data-tema="mork"] .maxKnapp, :root[data-tema="mork"] .merKnapp { background: rgba(20,23,28,.92); }
  body { margin: 0; background: var(--grund); color: var(--text);
         font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align: center; padding: 9px 16px 7px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--dov); }
  button { background: var(--yta); color: var(--text); border: 1px solid var(--linje);
           border-radius: 7px; padding: 7px 16px; font-size: 15px; cursor: pointer; }
  button:hover { background: var(--yta2); }
  select { background: var(--yta); color: var(--text); border: 1px solid var(--linje);
           border-radius: 6px; padding: 4px 6px; }
  input[type=range] { vertical-align: middle; accent-color: var(--markera); }
  a { color: var(--markera); }
  :focus-visible { outline: 2px solid var(--markera); outline-offset: 2px; }

  /* Styrfält: det man gör ofta, på en rad. Resten bakom ⚙. */
  #styrfalt { position: sticky; top: 0; z-index: 40; display: flex; align-items: center;
              gap: 10px; padding: 6px 12px; background: rgba(251,248,241,.96);
              backdrop-filter: blur(6px); box-shadow: 0 1px 0 var(--linje), 0 3px 12px rgba(80,66,40,.10); }
  #tidslinje { flex: 1; min-width: 90px; }
  #ar { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
        letter-spacing: .5px; flex: none; min-width: 3.2em; text-align: right; }
  #spela { padding: 5px 13px; font-size: 14px; flex: none; }
  .styrhoger { display: flex; gap: 5px; align-items: center; flex: none; }
  .mini { background: var(--yta); color: var(--text); border: 1px solid var(--linje);
          border-radius: 7px; padding: 6px 11px; font-size: 13px; cursor: pointer;
          display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .mini:hover { background: var(--markera-yta); border-color: var(--markera); }
  .mini .txt { font-size: 12px; color: var(--dov); }
  #vyfalt { display: inline-flex; align-items: center; gap: 7px; flex: none;
            background: var(--yta); border: 1px solid var(--linje); border-radius: 7px;
            padding: 3px 6px 3px 11px; }
  #vyfalt .vytxt { font-size: 12px; color: var(--dov); }
  #vyfalt select { border: 0; background: none; font-size: 13.5px; padding: 3px 2px; }
  .pop { position: absolute; z-index: 70; display: none; text-align: left;
         background: var(--yta); border: 1px solid var(--linje); border-radius: 10px;
         padding: 10px 13px; box-shadow: 0 10px 30px rgba(80,66,40,.22); min-width: 215px; }
  .pop.open { display: block; }
  .pop label { display: flex; align-items: center; justify-content: space-between;
               gap: 10px; color: var(--dov); font-size: 13px; margin: 7px 0; }
  #instpanel { top: calc(100% + 5px); right: 8px; }

  /* Globerna */
  .glober { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px;
            padding: 6px 12px; }
  .panel { text-align: center; }
  .panel.stor { position: fixed; inset: 0; z-index: 60; margin: 0;
                background: var(--grund); overflow: auto; padding: 6px 6px 12px; }
  .panel.stor canvas.glob, .panel.stor .saknas { width: min(94vw, 78vh); height: min(94vw, 78vh); }
  .panel.stor canvas.bar { width: min(94vw, 78vh); }
  .panel h2 { margin: 4px 0 6px; }
  /* Seriväljaren ÄR sidans huvudkontroll — hela poängen är att man byter serie.
     Som naken text såg den ut som en rubrik man inte kan röra. Nu är den en
     synlig knapp med ram, hover-lyft och en pil som säger att den öppnar något. */
  .serieknapp { background: var(--yta); border: 1px solid var(--linje);
                padding: 7px 12px 7px 15px; border-radius: 9px;
                font: 600 15px/1.3 inherit; color: var(--text);
                max-width: min(46vw, 560px); cursor: pointer;
                display: inline-flex; align-items: center; gap: 9px;
                box-shadow: 0 1px 3px rgba(80,66,40,.10);
                transition: border-color .14s, background .14s, box-shadow .14s; }
  .serieknapp:hover { background: var(--markera-yta); border-color: var(--markera);
                      box-shadow: 0 2px 8px rgba(80,66,40,.18); }
  .serieknapp .titel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .serieknapp .pil { color: var(--markera); font-size: 10px; flex: none;
                     background: var(--markera-yta); border-radius: 50%;
                     width: 18px; height: 18px; display: inline-flex;
                     align-items: center; justify-content: center; }
  .serieknapp:hover .pil { background: var(--markera); color: var(--yta); }
  :root[data-tema="mork"] .serieknapp:hover .pil { color: #14161a; }
  /* en diskret ledtext ovanför, som försvinner så fort man valt något */
  .bytrad { font-size: 11px; color: var(--svag); margin: 0 0 3px;
            letter-spacing: .04em; text-transform: uppercase; }
  /* Att skalan är logaritmisk hör hemma i bilden, inte i inställningarna */
  .logflagga { background: var(--bar-yta); color: var(--bar); border: 1px solid transparent;
               border-radius: 10px; padding: 3px 9px; margin-left: 2px; cursor: pointer;
               font-size: 10.5px; font-weight: 600; line-height: 1.3;
               letter-spacing: .03em; vertical-align: 2px; }
  .logflagga:hover { border-color: var(--bar); background: var(--bar-yta); }
  /* Nollnivån ska stå i vyn, inte i en meny — man ska kunna avgöra själv vad
     man ser. Den byter utseende när den är LÅST vid ett år. */
  .nollflagga { display: inline-block; margin-left: 6px; padding: 3px 9px;
                border-radius: 10px; font-size: 10.5px; font-weight: 500; line-height: 1.3;
                letter-spacing: .03em;
                color: var(--dov); background: var(--yta2); vertical-align: 2px;
                cursor: help; white-space: nowrap; }
  .nollflagga.last { color: var(--markera); background: var(--markera-yta);
                     font-weight: 600; }
  .pop hr { border: 0; border-top: 1px solid var(--linje); margin: 9px 0; }
  .globwrap { position: relative; display: inline-block; line-height: 0; }
  .globknappar { position: absolute; top: 10px; right: 10px; z-index: 5;
                 display: flex; gap: 6px; }
  .maxKnapp, .merKnapp { background: rgba(251,248,241,.94); color: var(--text);
              border: 1px solid var(--linje); border-radius: 7px; padding: 4px 10px;
              cursor: pointer; font-size: 15px; line-height: 1.15; display: flex;
              align-items: center; gap: 5px; white-space: nowrap;
              box-shadow: 0 2px 8px rgba(80,66,40,.20); }
  .maxKnapp:hover, .merKnapp:hover, .merKnapp.pa { background: var(--markera-yta); border-color: var(--markera); }
  .maxKnapp .txt, .merKnapp .txt { font-size: 12px; color: var(--dov); }
  .globPop { top: 40px; right: 8px; line-height: 1.5; }
  /* Undersök: globen väcker frågan, den här rutan pekar mot svaret */
  .undPop { top: 40px; right: 8px; max-width: 340px; line-height: 1.55; }
  .undPop h3 { margin: 0 0 6px; font-size: 14px; }
  .undPop p { margin: 7px 0; font-size: 12.5px; color: var(--text); }
  .undPop .und-meta { color: var(--dov); font-size: 11.5px; }
  .undPop .und-etikett { display: block; font-size: 10.5px; font-weight: 600;
                         letter-spacing: .05em; text-transform: uppercase;
                         color: var(--svag); margin-bottom: 2px; }
  .undPop .und-lank { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .undPop .und-lank a { font-size: 12.5px; }
  .undPop .und-fot { border-top: 1px solid var(--linje); padding-top: 8px;
                     color: var(--svag); font-size: 11px; }
  .globPop .stlRad { margin: 9px 0 2px; }
  .globPop .stlBtn { background: var(--yta2); color: var(--text); border: 1px solid var(--linje);
                     border-radius: 5px; padding: 3px 11px; font-size: 13px; }
  canvas.glob { width: min(var(--globbredd), calc(100vh - var(--globkrom)));
                height: min(var(--globbredd), calc(100vh - var(--globkrom)));
                background: radial-gradient(circle at 50% 40%, #fffdf9 0%, #efe7d6 78%);
                border-radius: 10px; cursor: grab; touch-action: none; display: block; }
  canvas.glob:active { cursor: grabbing; }
  canvas.bar { width: min(var(--globbredd), calc(100vh - var(--globkrom)));
               height: 46px; margin: 6px auto 0; display: block; }
  .saknas { width: min(var(--globbredd), calc(100vh - var(--globkrom))); height: 120px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto;
            border: 1px dashed var(--linje); border-radius: 10px; color: var(--dov); }
  .regel { max-width: min(var(--globbredd), calc(100vh - var(--globkrom)));
           margin: 4px auto 0; font-size: 11.5px; line-height: 1.45; color: var(--svag); }
  .regel b { color: var(--dov); font-weight: 600; }

  /* Två landdataglober bredvid varandra är en jämförelse — då är sambandet
     mellan dem en siffra man vill se, inte något man ska räkna ut i huvudet. */
  #mitt { align-self: center; flex: 0 0 auto; width: 182px; position: relative; }
  #korr { text-align: center;
          background: var(--yta); border: 1px solid var(--linje); border-radius: 12px;
          padding: 14px 12px; box-shadow: 0 1px 4px rgba(80,66,40,.10); }
  #korr.tom { display: none; }
  #korr .rubrik { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
                  color: var(--svag); margin-bottom: 6px; }
  #korr .varde { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
                 line-height: 1.1; }
  #korr .styrka { font-size: 11.5px; color: var(--dov); margin-top: 2px; }
  #korr .varde.tomt { color: var(--svag); }
  #korr .rad2 { font-size: 11px; color: var(--svag); margin-top: 8px;
                border-top: 1px solid var(--linje); padding-top: 7px; }
  #korr .rad2 b { font-weight: 600; color: var(--dov); font-variant-numeric: tabular-nums; }
  #korr { position: relative; }
  #korr .varn { font-size: 10.5px; color: var(--svag); margin-top: 7px; line-height: 1.4; }
  #korr .globkvot { text-align: left; }
  #korr .globkvot .kvotrad { display: flex; justify-content: space-between; gap: 8px;
        align-items: baseline; }
  #korr .globkvot .kvotrad i { font-style: normal; color: var(--svag); }
  #korr .globkvot .kvotenhet { display: block; text-align: right; color: var(--svag);
        font-size: 10px; margin-top: 1px; }
  #korr .globkvot .und-etikett { display: block; font-size: 9.5px; font-weight: 600;
        letter-spacing: .05em; text-transform: uppercase; color: var(--svag);
        margin-bottom: 3px; }
  #korr .vand { display: block; width: 100%; margin-top: 10px; padding: 6px 8px;
                font-size: 12px; background: var(--yta2); border: 1px solid var(--linje);
                border-radius: 7px; color: var(--dov); }
  #korr .vand:hover { background: var(--markera-yta); border-color: var(--markera);
                      color: var(--markera); }
  #korr .korrMer { display: block; margin: 5px auto 0; background: none; border: 0;
                   padding: 2px 4px; font-size: 10.5px; color: var(--markera);
                   cursor: pointer; text-decoration: underline; }
  .korrPop { top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
             width: min(380px, 86vw); max-height: 60vh; overflow-y: auto; text-align: left; }
  .korrPop h3 { margin: 0 0 8px; font-size: 14px; }
  .korrPop p { margin: 8px 0; font-size: 12.5px; line-height: 1.55; color: var(--text); }
  .korrPop b { color: var(--text); }
  @media (max-width: 760px) {
    #mitt { width: auto; flex-basis: 100%; order: 3; }
    /* Smal skärm: globerna ligger på rad, ingen tom yta att hänga i */
    #avlas { position: static; margin-top: 10px; }
  }

  /* Seriväljaren */
  #valjare { position: fixed; inset: 0; background: rgba(58,48,30,.42); z-index: 90;
             display: none; align-items: flex-start; justify-content: center;
             padding: 30px 16px; }
  #valjare.open { display: flex; }
  #valjareRuta { background: var(--yta); border: 1px solid var(--linje); border-radius: 12px;
                 width: 100%; max-width: 1000px; max-height: calc(100vh - 60px);
                 display: flex; flex-direction: column; box-shadow: 0 14px 44px rgba(80,66,40,.28); }
  #valjareTopp { display: flex; gap: 12px; align-items: center;
                 padding: 16px 20px; border-bottom: 1px solid var(--linje); }
  #valjareTopp h2 { margin: 0; font-size: 17px; flex: none; }
  #sok { flex: 1; background: var(--grund); color: var(--text); border: 1px solid var(--linje);
         border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  #valjareKropp { display: grid; grid-template-columns: 260px 1fr; min-height: 0; flex: 1; }
  #amnen { overflow-y: auto; border-right: 1px solid var(--linje); padding: 10px; }
  #amnen h4 { margin: 14px 0 5px; padding: 0 8px; font-size: 11px; letter-spacing: .09em;
              text-transform: uppercase; color: var(--svag); }
  .amne { display: flex; justify-content: space-between; gap: 8px; width: 100%;
          background: none; border: 0; padding: 6px 8px; border-radius: 6px;
          font-size: 13.5px; color: var(--text); text-align: left; }
  .amne:hover { background: var(--yta2); }
  .amne.pa { background: var(--markera-yta); color: var(--markera); font-weight: 600; }
  .amne b { font-weight: 500; color: var(--svag); font-variant-numeric: tabular-nums; }
  #serier { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 3px; }
  .serierad { display: flex; align-items: flex-start; gap: 2px; }
  .serierad .serie { flex: 1; }
  .stjarna { background: none; border: 0; color: #b8ac95; font-size: 16px; line-height: 1;
             padding: 8px 6px; cursor: pointer; border-radius: 6px; flex: none; }
  .stjarna:hover { color: var(--bar); background: var(--yta2); }
  .stjarna.pa { color: var(--bar); }
  .serie { display: block; width: 100%; text-align: left; background: none; border: 0;
           padding: 8px 11px; border-radius: 7px; }
  .serie:hover { background: var(--yta2); }
  .serie.pa { background: var(--markera-yta); }
  .serie .st { display: block; font-size: 14px; color: var(--text); }
  .serie .sm { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
               margin-top: 3px; font-size: 11.5px; color: var(--svag); }
  .serie .sm em { font-style: normal; color: var(--dov); }
  .serie .sm i { font-style: normal; font-variant-numeric: tabular-nums; }
  .ark { font: 600 10.5px/1 inherit; letter-spacing: .03em; padding: 3px 7px;
         border-radius: 10px; }
  .ark[data-a="tungsvans"] { background: var(--bar-yta); color: var(--bar); }
  .ark[data-a="intervall"] { background: var(--markera-yta); color: var(--markera); }
  .ark[data-a="andel"]     { background: var(--yta2); color: var(--dov); }
  .ark[data-a="signerad"]  { background: #ece0f0; color: #6b4a80; }
  .inga { color: var(--svag); padding: 20px; }

  .markor { position: fixed; z-index: 78; display: none; pointer-events: none;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 2px rgba(0,0,0,.55)); }
  /* Avläsningen: fast plats under sambandskortet, aldrig under muspekaren */
  /* Hänger under kortet i stället för att ligga i flödet: annars växer
     mittkolumnen när man pekar på ett land, och kortet hoppar uppåt vid varje
     hovring. Ytan under kortet är ändå tom. */
  #avlas { position: absolute; top: calc(100% + 10px); left: 0; right: 0;
           background: var(--yta); border: 1px solid var(--linje); border-radius: 12px;
           padding: 11px 12px; font-size: 12px; line-height: 1.4;
           box-shadow: 0 1px 4px rgba(80,66,40,.10); }
  #avlas .land { font-weight: 700; font-size: 13.5px; margin-bottom: 3px;
                 overflow-wrap: anywhere; }
  #avlas .post { display: flex; align-items: baseline; gap: 6px; margin-top: 6px;
                 padding-top: 5px; border-top: 1px solid var(--linje); }
  #avlas .pil { color: var(--svag); font-size: 10px; flex: none; }
  #avlas .post.p1 { flex-direction: row-reverse; }   /* höger glob, höger kant */
  #avlas .tal { font-weight: 600; color: var(--dov); font-size: 12.5px;
                font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #avlas .kvot { display: block; }
  #avlas .kvot .serie { color: var(--svag); font-size: 10px; letter-spacing: .04em;
                        text-transform: uppercase; }
  #avlas .kvot .tal { display: block; color: var(--markera); font-size: 15px; }
  #avlas .kvot .enhet { display: block; color: var(--svag); font-size: 10px;
                        line-height: 1.3; }
  #avlas.over { top: auto; bottom: calc(100% + 10px); }
  #avlas .uppmaning { color: var(--svag); font-size: 11px; text-align: center;
                      line-height: 1.4; }
  #om { position: fixed; inset: 0; background: rgba(58,48,30,.42); z-index: 95;
        display: none; align-items: flex-start; justify-content: center;
        padding: 40px 16px; overflow-y: auto; }
  #om.open { display: flex; }
  #omRuta { background: var(--yta); border: 1px solid var(--linje); border-radius: 12px;
            max-width: 720px; width: 100%; padding: 22px 26px 28px; }
  #omRuta h2 { margin: 0 0 12px; font-size: 20px; }
  #omRuta p { color: var(--text); font-size: 14px; line-height: 1.6; }
  #omTopp { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #status { text-align: center; color: var(--dov); padding: 30px 12px; }
  footer { text-align: center; color: var(--svag); font-size: 12px; padding: 14px 18px 26px; }

  @media (max-width: 760px) {
    #valjareKropp { grid-template-columns: 1fr; }
    #amnen { max-height: 30vh; border-right: 0; border-bottom: 1px solid #2f3742; }
  }
  @media (max-width: 560px) {
    header { display: none; }
    #styrfalt { padding: 4px 8px; gap: 7px; }
    #ar { font-size: 16px; min-width: 2.9em; }
    .mini { padding: 4px 8px; font-size: 12px; }
    .mini .txt, #vyfalt .vytxt { display: none; }
    #vyfalt { padding: 2px 4px; }
    .maxKnapp .txt, .merKnapp .txt { display: none; }
    .glober { gap: 6px; padding: 4px; }
    .panel { width: 47vw; }
    canvas.glob, .saknas { width: 46vw; height: 46vw; }
    canvas.bar { width: 46vw; height: 30px; }
